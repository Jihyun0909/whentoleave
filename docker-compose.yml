services:
  postgres:
    image: postgres:16
    container_name: myeotsienaga-postgres
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # 로컬에서 Redis 기반 Refresh Token 저장소를 테스트하고 싶을 때만 쓴다.
  # run-dev.bat 은 기본적으로 REFRESH_TOKEN_STORE=memory 라 이게 없어도 개발은 된다.
  redis:
    image: redis:7-alpine
    container_name: myeotsienaga-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  postgres-data:
