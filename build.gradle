plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT(Access/Refresh) 발급·검증. jjwt는 api만 컴파일 의존이고 impl/jackson은 런타임에만 필요.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 테스트는 인메모리 H2로 돈다 (src/test/resources/application.yml).
	// 로컬 Docker Postgres가 없어도 되게 해서, 클라우드 샌드박스(모바일에서 쓰는
	// Claude Code on the web 등)나 CI에서도 그대로 실행된다.
	// Redis도 마찬가지로 테스트에선 안 띄운다 - RefreshTokenStore를 인터페이스로 두고
	// 테스트 프로파일에선 인메모리 구현으로 바꾼다 (application.yml의 spring.autoconfigure.exclude).
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 한글 경로(개인 프로젝트) + Windows MS949 로케일 조합에서 테스트 워커가
	// 클래스패스를 잘못 해석해 ClassNotFoundException이 나는 문제 방지
	jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
