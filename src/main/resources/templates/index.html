<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>When To Leave</title>
</head>
<body>
<h1>When To Leave</h1>
<p>출발지/도착지 좌표를 입력하면, 막차로 도착하려면 몇 시까지 출발해야 하는지 알려줍니다.</p>

<form method="get" action="/">
    <fieldset>
        <legend>출발지</legend>
        <label>경도(SX) <input type="number" step="any" name="sx" th:value="${sx}" required></label>
        <label>위도(SY) <input type="number" step="any" name="sy" th:value="${sy}" required></label>
    </fieldset>
    <fieldset>
        <legend>도착지</legend>
        <label>경도(EX) <input type="number" step="any" name="ex" th:value="${ex}" required></label>
        <label>위도(EY) <input type="number" step="any" name="ey" th:value="${ey}" required></label>
    </fieldset>
    <button type="submit">계산하기</button>
</form>

<div th:if="${searched}">
    <div th:if="${feasible}">
        <p>막차로 도착하려면
            <strong th:text="${#temporals.format(departureTime, 'HH:mm')}"></strong>까지 출발하세요
            <span th:if="${nextDay}">(다음날 새벽)</span>
        </p>
    </div>
    <div th:unless="${feasible}">
        <p th:text="${reason}"></p>
    </div>
    <p><small>이 시각은 계획된 시간표 기준입니다. 출발 전 실시간 도착정보로 한 번 더 확인하세요.</small></p>
</div>
</body>
</html>
