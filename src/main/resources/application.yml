spring:
  application:
    name: transit
  autoconfigure:
    # JWT stateless 인증이라 Spring Boot 기본 폼로그인 유저(랜덤 비번 로그 출력)는 불필요.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  data:
    redis:
      # Refresh Token 저장소(app.refresh-token.store=redis일 때). 운영은 compose의 redis 서비스,
      # 로컬 bootRun은 REFRESH_TOKEN_STORE=memory로 두면 Redis 없이도 돈다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # StringRedisTemplate만 쓰고 Redis Repository는 안 쓴다(JPA 레포를 Redis로 오인 스캔하는 로그 방지).
      repositories:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/transit}
    username: ${DB_USERNAME:transit}
    password: ${DB_PASSWORD:transit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  batch:
    job:
      # 기동 시 Job 자동 실행 안 함 (정산은 스케줄러/관리자 API로만 트리거).
      enabled: false
  web:
    resources:
      chain:
        # CSS 파일명에 내용 해시를 붙인다(style.css -> style-<hash>.css).
        # 이게 없으면 브라우저가 예전 CSS를 계속 캐시해서, 스타일을 고쳐도 반영이 안 된다
        # (실제로 화면이 스타일 없이 렌더링되는 문제를 겪음).
        strategy:
          content:
            enabled: true
            paths: /**

app:
  jwt:
    # HS256 서명 키. 32바이트 이상이어야 하며 운영에서는 반드시 JWT_SECRET 환경변수로 덮어쓴다
    # (아래 기본값은 로컬/CI 전용). 키가 바뀌면 발급된 모든 토큰이 무효가 된다.
    secret: ${JWT_SECRET:dev-insecure-jwt-secret-override-in-production-0001}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    issuer: whentoleave
  refresh-token:
    # redis | memory. 운영은 redis(탈취 대비 서버측 저장·즉시 폐기), 테스트/로컬은 memory.
    store: ${REFRESH_TOKEN_STORE:redis}
  settlement:
    # false면 정산 스케줄러 미등록(수동 운영/테스트). 크론은 매일 03:00, 어제 거래 대상.
    scheduler-enabled: ${SETTLEMENT_SCHEDULER_ENABLED:true}
    cron: "0 0 3 * * *"
  staff:
    # 운영자·제휴사 관리자 시드 계정. 운영에서는 반드시 환경변수로 덮어쓴다(로그로 경고).
    admin-email: ${ADMIN_EMAIL:admin@whentoleave.local}
    admin-password: ${ADMIN_PASSWORD:admin-dev-password-change-me}
    partner-admin-email: ${PARTNER_ADMIN_EMAIL:partner-admin@whentoleave.local}
    partner-admin-password: ${PARTNER_ADMIN_PASSWORD:partner-dev-password-change-me}

google-routes:
  # 대중교통 경로탐색(환승 조합)용. Google Cloud Console에서 Routes API 활성화 후 발급.
  # 실제 키는 커밋하지 않는다. IntelliJ Run Configuration의 환경변수(GOOGLE_ROUTES_API_KEY)로 주입.
  base-url: https://routes.googleapis.com/directions/v2:computeRoutes
  api-key: ${GOOGLE_ROUTES_API_KEY:}

vworld:
  # 주소 -> 좌표 지오코딩(VWorld, 국토교통부)용. 실제 키는 커밋하지 않는다.
  # 로컬 실행 환경변수(VWORLD_API_KEY)로 주입.
  api-key: ${VWORLD_API_KEY:}

seoul-subway:
  # 서울시 지하철 실시간 도착정보(보조 기능, "오늘" 화면에만 표시). 키가 비어있으면 이 기능은
  # 조용히 꺼진 채로 동작한다(기존 시간표 기반 막차 계산에는 영향 없음).
  # 키 발급: openapi.seoul.go.kr 무료 가입. 로컬 실행 환경변수(SEOUL_SUBWAY_API_KEY)로 주입.
  base-url: http://swopenapi.seoul.go.kr/api/subway
  # TAGO가 시간표를 아예 안 주는 서울교통공사 운영 구간 역(사당·종합운동장·창동 등, 2026-08-25
  # 실사용 중 발견)의 보완용. 같은 SEOUL_SUBWAY_API_KEY를 그대로 쓴다(라이브로 확인 - 이 API
  # 전용 별도 키 불필요). SeoulSubwayLastTrainApiClient 참고.
  last-train-base-url: http://openAPI.seoul.go.kr:8088
  api-key: ${SEOUL_SUBWAY_API_KEY:}

seoul-bus:
  # 서울시 버스 실시간 도착정보. TAGO는 서울 시내버스를 커버하지 않아서(2026-08-18 라이브 확인:
  # 도시코드 목록 138개에 서울 없음, 서울 좌표 조회 시 0건 또는 경기/인천 소속 광역버스 정류소만
  # 잡힘) 서울만 별도 API를 쓴다.
  #
  # 두 개의 서로 다른 키가 필요하다:
  #  - arrival-api-key: data.go.kr "서울특별시_버스도착정보조회 서비스" (TAGO와 같은 키 사용 가능,
  #    단 서비스별로 활용신청이 따로다). Decoding(원본) 키를 넣는다.
  #  - stop-api-key: 정류소 좌표->정류소ID 매칭용. 좌표 기반 정류소 조회(stationinfo 서비스)는
  #    활용신청이 또 별개라, 대신 서울 열린데이터광장의 정류소 위치 데이터셋(전체 11,239건)을
  #    받아서 최근접 매칭한다. 지하철 실시간과 같은 키다.
  arrival-base-url: http://ws.bus.go.kr/api/rest/arrive/getLowArrInfoByStId
  arrival-api-key: ${SEOUL_BUS_API_KEY:${TAGO_API_KEY:}}
  stop-base-url: http://openapi.seoul.go.kr:8088
  stop-api-key: ${SEOUL_SUBWAY_API_KEY:}

# 아래 3개는 수도권 실시간 버스 도착정보(보조 기능). 전부 키가 비어있으면 조용히 꺼진 채로
# 동작한다. 키 발급: data.go.kr 활용신청(공공데이터포털) - Decoding(원본) 키를 넣어야 한다
# (각 클라이언트가 URL 인코딩을 직접 하므로 Encoding 키를 넣으면 이중 인코딩된다).
tago:
  # 국가대중교통정보센터(TAGO). 로컬 실행 환경변수(TAGO_API_KEY)로 주입.
  base-url: http://apis.data.go.kr/1613000/ArvlInfoInqireService
  # 좌표기반 근접 정류소 조회(정류소정보조회 서비스). 실제 오퍼레이션 경로는 추정값 - 확인 필요.
  station-base-url: http://apis.data.go.kr/1613000/BusSttnInfoInqireService/getCrdntPrxmtSttnList
  # 버스 노선정보(첫차/막차/배차간격 + 경유정류소 목록). 2026-08-20 라이브 테스트로 확인:
  # getRouteNoList/getRouteInfoIem/getRouteAcctoThrghSttnList 전부 정상 응답(TagoBusRouteDetailApiClient 참고).
  route-info-base-url: http://apis.data.go.kr/1613000/BusRouteInfoInqireService
  # 지하철 역 검색 + 역별 시간표. 2026-08-20 라이브 테스트로 확인: 다른 TAGO 서비스와 달리
  # base-url 끝에 "Service"가 안 붙고, 오퍼레이션명이 대문자 Get으로 시작한다(TagoSubwayApiClient 참고).
  subway-base-url: https://apis.data.go.kr/1613000/SubwayInfo
  api-key: ${TAGO_API_KEY:}

gyeonggi-bus:
  # 경기도 버스정보시스템(GBIS). 로컬 실행 환경변수(GYEONGGI_BUS_API_KEY)로 주입.
  # 2026-08-14 라이브 테스트로 확인: 도착정보(base-url)는 실제 키로 정상 응답.
  base-url: http://apis.data.go.kr/6410000/busarrivalservice/v2/getBusArrivalListv2
  # 2026-08-14 라이브 테스트로 확인: 실제 오퍼레이션은 getStationByPosList가 아니라
  # getBusStationAroundListv2. 활용신청 후 정상 응답 확인(응답 필드: busStationAroundList[].
  # stationId, stationName, x, y, distance).
  station-base-url: http://apis.data.go.kr/6410000/busstationservice/v2/getBusStationAroundListv2
  api-key: ${GYEONGGI_BUS_API_KEY:}

incheon-bus:
  # 인천 버스정보시스템(BIMS). 로컬 실행 환경변수(INCHEON_BUS_API_KEY)로 주입.
  # 2026-08-14 라이브 테스트로 확인: 경기(GBIS)와 벤더가 다르다 - 경로/파라미터/응답 스키마 모두 별개.
  # HTTP_ERROR(04)의 원인은 resultType 파라미터 누락이었다 - 값과 무관하게 파라미터 자체가 있어야
  # 통과된다(인천 BIMS 버그성 동작). resultType=json을 넣어도 응답은 항상 XML이라 IncheonBusApiClient가
  # DOM으로 직접 파싱한다. 상세는 IncheonBusApiClient/IncheonBusArrivalResponse 주석 참고.
  base-url: http://apis.data.go.kr/6280000/busArrivalService/getAllRouteBusArrivalList
  # 2026-08-14 라이브 테스트로 확인: 좌표기반 근접 조회 자체가 없다. 정류소명(bstopNm)으로만
  # 조회 가능한 getBusStationNmList뿐이고, 이마저 활용신청 안 되어 있음(SERVICE_KEY_IS_NOT_REGISTERED).
  # 좌표->정류소 매칭이 필요하면 이 API 대신 data.go.kr의 인천 정류소 현황 파일데이터(위경도 포함)를
  # 내려받아 로컬 캐시에서 최근접 매칭하는 방식을 검토해야 한다 - 좌표기반 실시간 조회 API가 없다.
  station-base-url: http://apis.data.go.kr/6280000/busStationService/getBusStationNmList
  api-key: ${INCHEON_BUS_API_KEY:}
