spring:
  application:
    name: transit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/transit}
    username: ${DB_USERNAME:transit}
    password: ${DB_PASSWORD:transit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

odsay:
  base-url: https://api.odsay.com/v1/api
  # 실제 키는 커밋하지 않는다. IntelliJ Run Configuration의 환경변수(ODSAY_API_KEY)로 주입.
  api-key: ${ODSAY_API_KEY:}

vworld:
  # 주소 -> 좌표 지오코딩(VWorld, 국토교통부)용. 실제 키는 커밋하지 않는다.
  # 로컬 실행 환경변수(VWORLD_API_KEY)로 주입.
  api-key: ${VWORLD_API_KEY:}
