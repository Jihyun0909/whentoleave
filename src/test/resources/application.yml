# 테스트 전용 설정.
#
# 클래스패스에서 test 리소스가 먼저 잡히므로 이 파일이 src/main의 application.yml을
# 통째로 대체한다(병합이 아니다). 그래서 테스트에 필요한 값은 여기에 다 있어야 한다.
#
# 목적: 테스트가 로컬 Docker Postgres에 의존하지 않게 하는 것. 그래야 PC가 꺼져 있어도
# 클라우드 샌드박스(모바일에서 쓰는 Claude Code on the web)나 CI에서 똑같이 돌아간다.
spring:
  application:
    name: transit
  datasource:
    # MODE=PostgreSQL: 운영 DB와 방언 차이를 줄인다. 이 프로젝트는 native query 없이
    # JPA만 써서 H2로도 충분하다 (native query가 생기면 Testcontainers로 옮겨야 한다).
    url: jdbc:h2:mem:transit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# 실제 호출은 테스트에서 전부 페이크로 막지만, 값이 비어 있으면 설정 주입이 실패하므로 더미를 둔다.
odsay:
  base-url: http://localhost/odsay-not-used-in-tests
  api-key: test-key

vworld:
  api-key: test-key

seoul-bus:
  base-url: http://localhost/seoul-bus-not-used-in-tests
  station-service-name: test-service
  api-key: "" # 빈 값 = 미설정 상태로 애플리케이션 컨텍스트 로딩 테스트(TransitApplicationTests)를 검증
