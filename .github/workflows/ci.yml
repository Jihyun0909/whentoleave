name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transit
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: transit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U transit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/transit
      DB_USERNAME: transit
      DB_PASSWORD: transit

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test --no-daemon
